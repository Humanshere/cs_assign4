{% extends "base.html" %}
{% block content %}
<h2>Stored XSS (MITIGATED: auto-escaping on output)</h2>
<p>The same script payload is now displayed as inert text, not executed.</p>
<form method="post">
  Name: <input name="author"><br>
  Comment: <input name="body" size="50"><br>
  <button type="submit">Post</button>
</form>
<h3>Comments</h3>
<ul>
{% for c in comments %}
  <li><b>{{ c.author }}:</b> {{ c.body }}</li>
{% endfor %}
</ul>
<p><a href="{{ url_for('index') }}">Home</a></p>
{% endblock %}
